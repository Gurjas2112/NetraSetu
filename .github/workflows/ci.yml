name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Postgres and Garage come from docker-compose.yml via scripts/dev_platform.py, which writes a
  # throwaway .env with generated secrets for this runner only.
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            service/requirements-gateway.txt
      - run: pip install -r service/requirements-gateway.txt -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python scripts/dev_platform.py postgres garage
      - run: python -m pytest -q
      - run: python eval/check_threshold_hash.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: service/requirements-gateway.txt
      - run: pip install -r service/requirements-gateway.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run test
      - name: Generated API types are up to date
        run: |
          python scripts/export_openapi.py
          npm --prefix web run gen:api
          git diff --exit-code -- web/src/api
      - run: npm --prefix web run build

  e2e:
    runs-on: ubuntu-latest
    env:
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: service/requirements-gateway.txt
      - run: pip install -r service/requirements-gateway.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python scripts/dev_platform.py postgres garage
      - run: npm --prefix web ci
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm --prefix web run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/test-results
          retention-days: 7

  # MATLAB job (matlab-actions/setup-matlab + run-tests). Needs a MathWorks
  # licence on the runner; treat failures here as HUMAN-VERIFY on the laptop.
  # continue-on-error keeps the workflow green when the licence is missing so
  # the gateway / web / e2e jobs remain the merge gate (AGENTS.md M7).
  matlab:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
        with:
          products: Image_Processing_Toolbox Computer_Vision_Toolbox Deep_Learning_Toolbox Statistics_and_Machine_Learning_Toolbox SimEvents
      - uses: matlab-actions/run-tests@v2
        with:
          source-folder: matlab matlab/nx
          select-by-folder: matlab/tests
