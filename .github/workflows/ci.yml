name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: netrasetu
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: netrasetu
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U netrasetu -d netrasetu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GATEWAY_ENGINE: fake
      ADMIN_DATABASE_URL: postgresql://netrasetu:ci-only-not-a-secret@localhost:5432/netrasetu
      GATEWAY_DB_PASSWORD: ci-gateway
      WORKER_DB_PASSWORD: ci-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            service/requirements-gateway.txt
      - run: pip install -r service/requirements-gateway.txt -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: service/requirements-gateway.txt
      - run: pip install -r service/requirements-gateway.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - name: Generated API types are up to date
        run: |
          python scripts/export_openapi.py
          npm --prefix web run gen:api
          git diff --exit-code -- web/src/api
      - run: npm --prefix web run build

  e2e:
    runs-on: ubuntu-latest
    env:
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: service/requirements-gateway.txt
      - run: pip install -r service/requirements-gateway.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm --prefix web run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/test-results
          retention-days: 7

  # MATLAB job (matlab-actions/setup-matlab + run-tests) is added in milestone M4.
